<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HB Daily — The Huntington Beach Word Game</title>
<meta name="description" content="A daily word game for Huntington Beach locals. New HB word every day.">
<style>
  :root {
    --sand: #faf6ee;
    --ink: #1d3040;
    --ink-soft: #5b6b78;
    --ocean: #2a9d8f;
    --gold: #e9c46a;
    --absent: #a8b0b7;
    --sunset: #ee6c4d;
    --tile-border: #d8d2c4;
    --key-bg: #e7e1d4;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--sand);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #app {
    width: 100%;
    max-width: 500px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 8px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px 8px;
    border-bottom: 2px solid var(--tile-border);
  }
  .brand { display: flex; flex-direction: column; }
  .brand h1 {
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: 800;
  }
  .brand h1 .hb { color: var(--sunset); }
  .brand .tagline {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .streak-chip {
    background: var(--white);
    border: 1.5px solid var(--tile-border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--sunset);
  }
  .icon-btn {
    background: var(--white);
    border: 1.5px solid var(--tile-border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .share-preview {
    background: var(--white);
    border: 1.5px solid var(--tile-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    margin-top: 10px;
    color: var(--ink);
  }
  .preview-banner {
    text-align: center;
    background: var(--gold);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 5px;
    border-radius: 6px;
    margin: 6px 0 0;
  }
  .puzzle-meta {
    text-align: center;
    padding: 8px 0 2px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: 1px;
  }
  #board-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 0;
  }
  #board { display: grid; gap: 5px; }
  .row { display: grid; gap: 5px; }
  .tile {
    width: var(--tile-size, 58px);
    height: var(--tile-size, 58px);
    border: 2px solid var(--tile-border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 800;
    text-transform: uppercase;
    background: var(--white);
    transition: transform 0.08s;
  }
  .tile.filled { border-color: var(--ink-soft); transform: scale(1.04); }
  .tile.correct { background: var(--ocean); border-color: var(--ocean); color: #fff; }
  .tile.present { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .tile.absent { background: var(--absent); border-color: var(--absent); color: #fff; }
  .tile.reveal { animation: flip 0.4s ease; }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  .row.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-6px); }
    40%,80% { transform: translateX(6px); }
  }
  #hint-area { text-align: center; min-height: 40px; padding: 4px 12px; }
  #hint-btn {
    background: none;
    border: 1.5px dashed var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #hint-text {
    font-size: 14px;
    color: var(--ink);
    background: var(--white);
    border: 1.5px solid var(--gold);
    border-radius: 8px;
    padding: 6px 12px;
    display: inline-block;
  }
  #hint-text .cat { color: var(--sunset); font-weight: 700; }
  #toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
    max-width: 90%;
    text-align: center;
  }
  #toast.show { opacity: 1; }
  #keyboard { padding: 6px 0 12px; user-select: none; }
  .kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 6px; }
  .key {
    flex: 1;
    max-width: 42px;
    height: 52px;
    background: var(--key-bg);
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    text-transform: uppercase;
  }
  .key.wide { max-width: 64px; flex: 1.6; font-size: 12px; }
  .key.correct { background: var(--ocean); color: #fff; }
  .key.present { background: var(--gold); }
  .key.absent { background: var(--absent); color: #fff; }
  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(29, 48, 64, 0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--sand);
    width: 100%;
    max-width: 500px;
    border-radius: 18px 18px 0 0;
    padding: 20px 20px 28px;
    max-height: 88dvh;
    overflow-y: auto;
    animation: slideup 0.25s ease;
  }
  @keyframes slideup { from { transform: translateY(40px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
  .modal .close-x {
    float: right;
    background: none;
    border: none;
    font-size: 22px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .modal h2 { font-size: 20px; margin-bottom: 4px; }
  .result-word {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--ocean);
    margin: 6px 0 2px;
  }
  .result-word.lost { color: var(--sunset); }
  .blurb {
    background: var(--white);
    border-left: 4px solid var(--sunset);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.45;
    margin: 12px 0;
  }
  .blurb .blurb-label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--sunset);
    margin-bottom: 4px;
  }
  .stats-grid {
    display: flex;
    justify-content: space-around;
    margin: 14px 0;
    text-align: center;
  }
  .stat .num { font-size: 26px; font-weight: 800; }
  .stat .lbl { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.5px; }
  .share-btn {
    width: 100%;
    background: var(--ocean);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 6px;
  }
  .share-btn:active { transform: scale(0.98); }
  .countdown {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 14px;
  }
  .countdown b { color: var(--ink); }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    padding-bottom: 8px;
  }
  @media (max-height: 700px) {
    .tile { --tile-size: 48px; font-size: 22px; }
    .key { height: 46px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1><span class="hb">HB</span> DAILY</h1>
      <div class="tagline">The Huntington Beach word game</div>
    </div>
    <div class="header-right">
      <div class="streak-chip" id="streak-chip" title="Current streak">STREAK 0</div>
      <button class="icon-btn" id="stats-btn" title="Stats">STATS</button>
    </div>
  </header>

  <div class="puzzle-meta" id="puzzle-meta"></div>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="hint-area">
    <button id="hint-btn">Need a hint?</button>
    <div id="hint-text" style="display:none"></div>
  </div>

  <div id="keyboard"></div>
  <div class="footer-note">A daily word game for HB locals. New word every day at midnight.</div>
</div>

<div id="toast"></div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ============ CONFIG ============
var EPOCH = new Date(2026, 7, 4); // Aug 4, 2026 — day 1. Change to your launch date.
var SITE_URL = "https://mike-oddbytes.github.io/blockparty/hb-daily.html";     // live GitHub Pages URL for the pilot; custom domain deferred
var MAX_GUESSES = 6;

// word, clue, category, blurb
var WORDS = [
["SURF","The city's trademarked identity","Culture","Surf City USA. HB fought Santa Cruz for the trademark and won it in the 2000s. Day one had to be this."],
["PIER","1,850 feet of HB's most famous landmark","Icons","The HB Pier stretches 1,850 feet, one of the longest on the West Coast. First built in 1904, rebuilt in 1992 after winter storms took it down."],
["DUKE","Surfing's godfather, and a restaurant at the pier","History","Duke Kahanamoku, the father of modern surfing, lends his name to the restaurant at the base of the pier."],
["BOLSA","Chica's first name","Nature","The Bolsa Chica Ecological Reserve: 1,300+ acres of restored wetlands and one of SoCal's best birding spots."],
["SWELL","What every surfer checks before coffee","Surf","South swells light up the pier bowl all summer. Surfline, which calls the forecast for most of the world, is headquartered right here in HB."],
["MAIN","The street where downtown happens","Streets","Main Street: from PCH up to the fountain, home to the Surfing Walk of Fame."],
["GLOOM","June's gray morning blanket","Nature","June Gloom is the marine layer that parks over the coast on late spring mornings. Gray until noon, then the sun shows up like nothing happened."],
["GROM","A very young surfer","Surf slang","Every HB grom dreams of a US Open heat at the pier southside."],
["TOWER","Lifeguards watch from these","Beach","HB Marine Safety staffs towers along 3.5 miles of city beach. Tower Zero sits on the pier itself."],
["SUGAR","___ Shack, the Main Street breakfast institution","Eats","The Sugar Shack Cafe has fed surfers on Main Street since 1967. Get there before the dawn patrol crowd."],
["STOKED","The only acceptable mood after a good session","Surf slang","The official emotional state of Huntington Beach."],
["SUNSET","The beach HB annexed in 2011","Places","Sunset Beach kept its funky water-tower-house charm after joining HB in 2011."],
["KOOK","What you don't want to be called in the lineup","Surf slang","Universal surf-speak for someone who doesn't know what they're doing. Don't ditch your board on a crowded day."],
["OPEN","The summer contest that takes over the pier","Events","The US Open of Surfing traces back to 1959, when the first West Coast Surfing Championships ran on the same sand by the pier. It has grown into the biggest surf contest in the world."],
["GOLDEN","West of this street, a college shares the name","Streets","Goldenwest Street runs the length of the city, and Golden West College has anchored it since 1966."],
["DAWN","___ patrol: the earliest session","Surf","Dawn patrol: in the water before work, before crowds, before the wind."],
["OILERS","HB High's mascot","Schools","The Huntington Beach High Oilers, named for the 1920s oil boom that briefly made this town a forest of derricks."],
["WHALE","Winter giant passing offshore","Nature","Gray whales stream past Huntington Beach between December and April on the run between Alaska and Baja. On a clear winter day you can spot a spout from the end of the pier."],
["BONFIRE","What the rings south of the pier are for","Beach","HB has hundreds of beach fire rings, among the last remaining in Southern California. Get there early on summer weekends."],
["CRUDE","What Standard Oil struck here in 1920","History","The 1920 oil strike transformed a sleepy beach town. At the peak, derricks outnumbered houses."],
["SHAKA","The hand sign that means it's all good","Culture","Thumb and pinky out. If you know, you know."],
["MUSEUM","Where Surf City keeps its history, on Olive Avenue","Culture","The International Surfing Museum opened in 1987 and has called Olive Avenue home since 1990. Boards, photos and memorabilia tell how a beach town became Surf City USA."],
["TIDE","Check the chart before you paddle out","Surf","Tide swings shape everything here, from the pier bowl to Bolsa Chica birding."],
["PARADE","HB's Fourth of July tradition since 1904","Events","The HB Fourth of July Parade has run since 1904 and ranks among the largest Independence Day parades in the West."],
["KELP","Underwater forest offshore","Nature","Kelp beds offshore keep the water rich, the fishing good, and occasionally wrap your leash."],
["GNARLY","Heavy, intense, or just impressive","Surf slang","Applies equally to double-overhead days and parking on Main Street in July."],
["EDISON","High school that shares its name with the power company","Schools","Edison High Chargers, named for Southern California Edison, which donated the land the school sits on. The company's power plant still looms over Newland."],
["PACIFIC","The ocean, the coast highway, and the mall","Places","Pacific City opened in 2015 on the bluff overlooking the pier, on land that sat empty for decades."],
["SANDBAR","The hidden architecture under every HB peak","Surf","Huntington Beach is a beach break, so its waves rise over sandbars that storms and tides constantly rearrange. When a good bar sets up, word gets around fast."],
["LIBRARY","The Central Park building with indoor fountains","Places","HB's Central Library, designed by the Neutra firm, opened in 1975 with flowing indoor fountains. One of the most beautiful public buildings in OC."],
["DONUT","Fuel for the Saturday sunrise car meet","Events","Since the mid 1980s, hot rods and woodies have filled the corner of Adams and Magnolia at dawn every Saturday for Donut Derelicts. No fees, no trophies, just coffee and chrome."],
["LEASH","The cord that keeps your board from becoming a missile","Surf","Invented in the 1970s, mandatory etiquette at a crowded pier."],
["CENTRAL","HB's 350-acre park","Places","Central Park: about 350 acres of trails, lakes, a disc golf course, and an equestrian center. One of the biggest city parks in OC."],
["TERN","Small seabird nesting protected at Bolsa Chica","Nature","California least terns nest at Bolsa Chica every summer. The fenced-off sand isn't for you, it's for them."],
["WETSUIT","Year-round necessity in HB water","Surf","The Pacific here rarely tops 70 degrees. Rubber is not optional most of the year."],
["SATURN","Moon rocket with a stage built right here","History","The third stage of the Saturn V moon rocket was built at the Douglas plant in Huntington Beach. Every Apollo crew that reached the Moon rode hardware assembled in Surf City."],
["GLASSY","Perfect no-wind morning conditions","Surf","When the surface goes glassy at first light, everything else can wait."],
["VANS","Title sponsor of the US Open of Surfing","Events","The Vans US Open of Surfing, the world's biggest surf competition, takes over the pier southside every summer."],
["EGRET","Tall white wader in the wetlands","Nature","Snowy and great egrets stalk the Bolsa Chica channels at low tide."],
["WARNER","The avenue that takes you to Sunset Beach","Streets","Warner Avenue runs from the harbour clear across the city. The Warner and PCH corner is your gateway to Sunset Beach."],
["WIPEOUT","The fall every surfer knows by heart","Surf","The crash at the end of a ride, made famous far beyond the lineup by the 1963 surf-rock hit of the same name. Every HB surfer has a personal highlight reel."],
["CELERY","The crop that ruled HB before oil did","History","Before the 1920 oil boom, the peat soil around Huntington Beach grew so much celery the area was called the Celery Capital. Trainloads rolled out on the Southern Pacific line."],
["LOCALS","Who gets the best peaks at dawn","Culture","Every break has its regulars. Respect goes a long way at the pier."],
["MARINA","Vikings territory","Schools","Marina High has repped the northwest side since 1963. The Vikings name came along two years later."],
["BARREL","Inside the wave, the whole point","Surf","Getting barreled at the pier on a south swell is the local rite of passage."],
["TUESDAY","The night Main Street kicks out the cars","Events","Every Tuesday evening, Main Street closes to traffic for Surf City Nights, a farmers market and street fair. It is the night the tourist strip turns back into a small town."],
["PLOVER","Tiny protected shorebird on HB sand","Nature","Western snowy plovers are why parts of the beach are roped off. They weigh about as much as a golf ball."],
["HENRY","The Huntington the city is named for","History","Henry Huntington, the railroad magnate whose Pacific Electric line put the town on the map. It took his name in 1903, and his Red Cars rolled in the next year."],
["LINEUP","Where surfers wait their turn","Surf","The pier lineup is a hierarchy. Watch before you paddle to the peak."],
["STRAND","The shopping block at 5th and PCH","Places","The Strand at Downtown HB, the 2009 development that brought a hotel and restaurants to 5th and PCH."],
["CUTBACK","The turn that carves back toward the power","Surf","A cutback swings the surfer back toward the breaking part of the wave to stay in its power. It is the bread-and-butter turn you will see all day from the pier rail."],
["TROLLEY","How Angelenos reached HB before freeways","History","Pacific Electric Red Cars ran from LA to the HB pier. The trolley made this a beach-day town a century before the 405."],
["HARBOUR","HB's waterfront neighborhood, with a fancy U","Places","Huntington Harbour, the only part of town that spells itself the British way. Five islands, endless docks."],
["SKIM","Board sport for the last inch of ocean","Beach","Skimboarders sprint along the wet sand, drop their boards on the thin wash and glide into the shorebreak. HB's flat sand and punchy inside make it a natural playground."],
["DERRICK","The oil structures that once lined PCH","History","Oil derricks covered HB's coastline for decades. A few working pumps still nod away behind fences around town, the last traces of the boom."],
["BLUFFS","The high ground along PCH with the ten-mile view","Places","Bluff Top Park rides the low cliffs along PCH with views up and down the coast. At its north end, the sand below is Dog Beach, where the town's pups get their ocean time."],
["JETTY","Rock structure that shapes the waves near the river mouth","Surf","The Santa Ana River jetties mark HB's southern surf boundary, and some of its most consistent waves."],
["DEAN","Jan's partner on the song that named the city","Culture","Jan and Dean's 1963 hit Surf City gave HB its nickname. Two girls for every boy."],
["PELICAN","Big-billed glider cruising past the lineup","Nature","Brown pelicans nearly vanished when DDT thinned their eggshells, and spent decades on the endangered list before recovering in 2009. Today squadrons glide past the pier like it never happened."],
["JACKS","Surf shop holding down Main and PCH since 1957","Icons","Jack Hokanson opened Jack's Surfboards at Main and PCH in 1957, one of California's first true surf shops. The family-run flagship still anchors the busiest corner in town."],
["GRUNION","Little silver fish that comes ashore by moonlight","Nature","On summer nights after a full or new moon, grunion ride waves onto the wet sand to lay their eggs. Watching a run at Bolsa Chica State Beach is a classic late-night outing."],
["AIRSHOW","Jets over the pier every fall","Events","The Pacific Airshow draws some of the biggest crowds of the year to the waterfront each fall. The Thunderbirds and Snowbirds use the pier as their centerline."],
["BENSON","First women's champion crowned at the pier in 1959","History","Linda Benson won the women's title at the very first West Coast Surfing Championships at the pier in 1959. That contest grew up to become the US Open of Surfing."],
["FAME","Surfing Walk of ___, on Main Street","Culture","The Surfing Walk of Fame at PCH and Main has honored surf legends since 1994. Check the sidewalk next time you cross."],
["DWIGHT","Beach stand slinging cheese strips since 1932","Eats","Dwight Clapp opened the city's first beach concession in 1932. Nearly a century later, his stand's cheese strips are still a beach-day ritual."],
["TALBERT","Avenue named for an early HB family","Streets","Tom Talbert, early county supervisor and HB pioneer. His name is on the avenue and half the old maps."],
["MEADOW","___lark: HB's former airport","History","Meadowlark Airport operated until 1989. The runway is a neighborhood of homes now, but old-timers still remember planes coming in low over Warner."],
["MONARCH","Orange royalty wintering in a local grove","Nature","Monarch butterflies spend the winter clustered in the eucalyptus at Norma Brandel Gibbs Park. Volunteers restored the grove and planted milkweed to keep them coming back."],
["PERQS","Main Street's oldest bar, live bands and all","Eats","Perqs has been pouring on Main Street since 1974, making it the oldest bar downtown. Blues great Walter Trout treated it as his home stage for years."],
["CRUISE","___ of Lights: December in the harbour","Events","The Cruise of Lights has toured Huntington Harbour's decorated waterfront homes at holiday time since 1962."],
["CORKY","First-name surf legend who made riding waves a paying job","Surf","Corky Carroll is widely credited as the first surfer to go fully professional, winning more than 100 contests. His Huntington Beach surf school has put beginners on their first wave since 1996."],
["NEWLAND","HB's oldest house sits on this family's land","History","The Newland House, built in 1898, is the oldest residence in HB, kept by the historical society at Beach and Adams."],
["WIEDER","Bluff-top regional park named for a county trailblazer","Places","Harriett Wieder was the first woman elected to the Orange County Board of Supervisors and a former HB mayor. The regional park on the bluff above Bolsa Chica carries her name."],
["SHUFFLE","The slide-step every HB wader should know","Beach","Round stingrays love the warm shallows here, so lifeguards teach the stingray shuffle: slide your feet and the rays scoot away. One day in 2019 saw 176 people stung."],
["KANOA","HB-raised Olympian with back-to-back US Open wins","Surf","Kanoa Igarashi grew up in Huntington Beach and won the US Open of Surfing at the pier two years running, 2017 and 2018. He took silver when surfing debuted at the Tokyo Olympics."],
["GUSHER","What Bolsa Chica No. 1 became in November 1920","History","On November 6, 1920, the Bolsa Chica No. 1 well blew in at 1,742 barrels a day. The boom that followed more than tripled the town's population."],
["PASEA","The hotel on the bluff at Pacific City","Places","The Pasea Hotel opened in 2016, a year after Pacific City next door. Best rooftop view of the pier in town."],
["OLIVE","Tree-named downtown avenue where surf history lives","Streets","Olive Avenue is one of downtown's original tree-named streets and home to the International Surfing Museum. Not bad for a block most visitors walk right past."],
["SANCHOS","Surf-style taco shack across PCH from the sand","Eats","Sancho's Tacos grew from backyard cookouts into a beloved taco stop right on PCH. Locals cross the highway barefoot for the tri-tip OG taco."],
["SHIPLEY","Central Park's nature center","Nature","The Shipley Nature Center, 18 acres of restored habitat inside Central Park, volunteer-run and free."],
["GILBERT","One of the five man-made islands in the Harbour","Places","Gilbert Island is one of five man-made islands dredged into existence when Huntington Harbour construction began in 1963. Most homes there come with a boat dock out back."],
["BEAR","Golden PCH nightspot where Janis Joplin played","History","The Golden Bear on PCH was Huntington Beach's legendary little music room, hosting Janis Joplin, Neil Young and Jackson Browne. It came down in 1986, and locals still miss it."],
["CORBINA","Wary summer surf fish that hunts in inches of water","Nature","The California corbina prowls the wet sand in summer, rooting out sand crabs in water barely deep enough to cover its back. Surf anglers know how hard it is to fool."],
["SLATER","An HB avenue, not the 11-time world champ","Streets","Slater Avenue crosses the whole city. No relation to Kelly, but tell your out-of-town friends whatever you want."],
["FREETH","Gave HB's first surfing demonstration in 1914","History","George Freeth, 'the man who can walk on water,' demonstrated surfing at the pier's 1914 rededication. HB's surf story starts with him."],
["WORTHY","Park named for the man who built the park system","Places","Worthy Park honors Norman Worthy, the parks director who assembled 626 acres of parkland across the city. For the man who built HB's park system, the name fits."],
["RUBYS","Red-roofed diner that capped the pier for 28 years","Eats","From 1993 to 2021, the walk to the end of the pier finished at Ruby's, a shiny red-and-white diner over the waves. A burger and shake above the surf was a rite of passage."],
["DWYER","Middle school named for the woman who did every job in it","Schools","Ethel Dwyer attended the original schoolhouse on the site, then spent her career there as teacher, librarian, nurse and dean. In the 1980s the school took her name."],
["AMIGOS","The friends who fought for the wetlands","History","Amigos de Bolsa Chica formed in 1976 to stop a marina and housing project planned for the wetlands. Their fight led the state to buy 880 acres and sparked one of the largest wetland restorations in Southern California."],
["FURUTA","Family farm at Historic Wintersburg","History","The Furuta family bought their Wintersburg farm in 1908 and built the bungalow that still stands in 1912. It is one of the last surviving pre-WWII Japanese American settlements in the country."],
];

// ============ DAILY PUZZLE ============
function daysBetween(a, b) {
  var ms = new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate());
  return Math.round(ms / 86400000);
}
var params = new URLSearchParams(location.search);

// ?reset=1 wipes all saved progress and stats, then reloads clean
if (params.has("reset")) {
  try {
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf("hbd_") === 0) localStorage.removeItem(k);
    });
  } catch (e) {}
  location.replace(location.pathname);
}

// ?preview=win or ?preview=lose simulates a finished game (no stats saved)
var PREVIEW = params.get("preview") === "win" || params.get("preview") === "lose" ? params.get("preview") : null;

var dayNum; // 1-based puzzle number
if (params.has("day")) {
  dayNum = Math.max(1, parseInt(params.get("day"), 10) || 1);
} else {
  dayNum = Math.max(1, daysBetween(EPOCH, new Date()) + 1);
}
var entry = WORDS[(dayNum - 1) % WORDS.length];
var ANSWER = entry[0], CLUE = entry[1], CATEGORY = entry[2], BLURB = entry[3];
var LEN = ANSWER.length;

// ============ STATE ============
var guesses = [];      // submitted guesses
var current = "";      // current typing
var gameOver = false;
var won = false;
var usedHint = false;
var keyStates = {};    // letter -> correct|present|absent

function loadJSON(k, d) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
}
function saveJSON(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
var stats = loadJSON("hbd_stats", { played: 0, won: 0, streak: 0, maxStreak: 0, lastWonDay: 0, dist: [0,0,0,0,0,0] });
var dayState = loadJSON("hbd_day_" + dayNum, null);

// streak display: broken if a day was skipped
function displayStreak() {
  if (stats.lastWonDay && dayNum > stats.lastWonDay + 1) return 0;
  return stats.streak;
}

// ============ BOARD ============
var boardEl = document.getElementById("board");
var tiles = []; // [row][col]
function buildBoard() {
  boardEl.innerHTML = "";
  tiles = [];
  var size = LEN >= 7 ? 50 : (LEN >= 6 ? 54 : 58);
  for (var r = 0; r < MAX_GUESSES; r++) {
    var row = document.createElement("div");
    row.className = "row";
    row.style.gridTemplateColumns = "repeat(" + LEN + ", 1fr)";
    var rowTiles = [];
    for (var c = 0; c < LEN; c++) {
      var t = document.createElement("div");
      t.className = "tile";
      t.style.setProperty("--tile-size", size + "px");
      row.appendChild(t);
      rowTiles.push(t);
    }
    boardEl.appendChild(row);
    tiles.push(rowTiles);
  }
}

// Wordle two-pass scoring
function scoreGuess(guess) {
  var res = new Array(LEN).fill("absent");
  var remaining = {};
  for (var i = 0; i < LEN; i++) {
    if (guess[i] === ANSWER[i]) res[i] = "correct";
    else remaining[ANSWER[i]] = (remaining[ANSWER[i]] || 0) + 1;
  }
  for (var j = 0; j < LEN; j++) {
    if (res[j] === "correct") continue;
    if (remaining[guess[j]] > 0) { res[j] = "present"; remaining[guess[j]]--; }
  }
  return res;
}

function paintRow(rowIdx, guess, animate) {
  var res = scoreGuess(guess);
  for (var i = 0; i < LEN; i++) {
    (function (i) {
      var apply = function () {
        tiles[rowIdx][i].textContent = guess[i];
        tiles[rowIdx][i].classList.add(res[i], "reveal");
        var prev = keyStates[guess[i]];
        var rank = { absent: 0, present: 1, correct: 2 };
        if (!prev || rank[res[i]] > rank[prev]) keyStates[guess[i]] = res[i];
        paintKeyboard();
      };
      if (animate) setTimeout(apply, i * 220); else apply();
    })(i);
  }
  return res;
}

function paintCurrent() {
  var r = guesses.length;
  if (r >= MAX_GUESSES) return;
  for (var i = 0; i < LEN; i++) {
    var t = tiles[r][i];
    t.textContent = current[i] || "";
    t.classList.toggle("filled", !!current[i]);
  }
}

// ============ KEYBOARD ============
var KB_ROWS = ["QWERTYUIOP", "ASDFGHJKL", "!ZXCVBNM<"]; // ! = enter, < = backspace
var keyEls = {};
function buildKeyboard() {
  var kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  KB_ROWS.forEach(function (rowStr) {
    var row = document.createElement("div");
    row.className = "kb-row";
    rowStr.split("").forEach(function (ch) {
      var b = document.createElement("button");
      if (ch === "!") { b.textContent = "ENTER"; b.className = "key wide"; b.onclick = function () { onKey("ENTER"); }; }
      else if (ch === "<") { b.textContent = "DEL"; b.className = "key wide"; b.onclick = function () { onKey("BACK"); }; }
      else { b.textContent = ch; b.className = "key"; b.onclick = function () { onKey(ch); }; keyEls[ch] = b; }
      row.appendChild(b);
    });
    kb.appendChild(row);
  });
}
function paintKeyboard() {
  for (var ch in keyEls) {
    keyEls[ch].classList.remove("correct", "present", "absent");
    if (keyStates[ch]) keyEls[ch].classList.add(keyStates[ch]);
  }
}

function onKey(k) {
  if (gameOver) return;
  if (k === "ENTER") return submitGuess();
  if (k === "BACK") { current = current.slice(0, -1); paintCurrent(); return; }
  if (/^[A-Z]$/.test(k) && current.length < LEN) { current += k; paintCurrent(); }
}
document.addEventListener("keydown", function (e) {
  if (document.getElementById("modal-backdrop").classList.contains("open")) return;
  if (e.key === "Enter") onKey("ENTER");
  else if (e.key === "Backspace") onKey("BACK");
  else if (/^[a-zA-Z]$/.test(e.key)) onKey(e.key.toUpperCase());
});

// ============ GAME FLOW ============
function toast(msg, ms) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove("show"); }, ms || 1600);
}

function submitGuess() {
  if (current.length !== LEN) {
    toast("Not enough letters — today's word has " + LEN);
    var rowEl = boardEl.children[guesses.length];
    rowEl.classList.add("shake");
    setTimeout(function () { rowEl.classList.remove("shake"); }, 450);
    return;
  }
  var guess = current;
  var rowIdx = guesses.length;
  guesses.push(guess);
  current = "";
  paintRow(rowIdx, guess, true);

  var revealDelay = LEN * 220 + 150;
  if (guess === ANSWER) {
    gameOver = true; won = true;
    finishGame(revealDelay);
  } else if (guesses.length >= MAX_GUESSES) {
    gameOver = true; won = false;
    finishGame(revealDelay);
  } else if (guesses.length === 3 && !usedHint) {
    setTimeout(function () { toast("Stuck? Hint's below the board", 2200); }, revealDelay);
  }
  saveDayState();
}

function saveDayState() {
  if (PREVIEW) return;
  saveJSON("hbd_day_" + dayNum, { guesses: guesses, over: gameOver, won: won, hint: usedHint });
}

function finishGame(delay) {
  // update stats only once per day (never in preview mode)
  if (!PREVIEW && (!dayState || !dayState.over)) {
    stats.played++;
    if (won) {
      stats.won++;
      stats.dist[guesses.length - 1]++;
      stats.streak = (stats.lastWonDay === dayNum - 1) ? stats.streak + 1 : 1;
      if (stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
      stats.lastWonDay = dayNum;
    } else {
      stats.streak = 0;
    }
    saveJSON("hbd_stats", stats);
  }
  saveDayState();
  dayState = loadJSON("hbd_day_" + dayNum, null);
  updateStreakChip();
  setTimeout(function () { openResultModal(); }, delay || 0);
}

function updateStreakChip() {
  document.getElementById("streak-chip").textContent = "STREAK " + displayStreak();
}

// ============ HINT ============
document.getElementById("hint-btn").onclick = function () {
  usedHint = true;
  this.style.display = "none";
  var h = document.getElementById("hint-text");
  h.innerHTML = '<span class="cat">' + CATEGORY + '</span> &middot; ' + CLUE;
  h.style.display = "inline-block";
  saveDayState();
};

// ============ SHARE ============
// GRID_STYLE: "text" uses plain characters. Set to "squares" for the
// classic colored-square grid (uses emoji block characters).
var GRID_STYLE = "text";
var GRID_CHARS = {
  text:    { correct: "#", present: "+", absent: "-" },
  squares: { correct: "🟩", present: "🟨", absent: "⬜" }
};
function resultGrid() {
  var chars = GRID_CHARS[GRID_STYLE];
  return guesses.map(function (g) {
    var res = scoreGuess(g);
    return res.map(function (r) { return chars[r]; }).join("");
  }).join("\n");
}
function shareText() {
  var score = won ? guesses.length : "X";
  return "HB Daily #" + dayNum + " " + score + "/" + MAX_GUESSES + (usedHint ? "*" : "") + "\n\n" + resultGrid() + "\n\n" + SITE_URL;
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}
function doShare() {
  var text = shareText();
  if (navigator.share) {
    navigator.share({ text: text }).catch(function (err) {
      if (err && err.name !== "AbortError") copyShare(text);
    });
  } else {
    copyShare(text);
  }
}
function copyShare(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { toast("Copied. Paste it in the group chat."); },
      function () {
        if (fallbackCopy(text)) toast("Copied. Paste it in the group chat.");
        else toast("Couldn't copy automatically. Long-press the text below to copy.");
      }
    );
  } else if (fallbackCopy(text)) {
    toast("Copied. Paste it in the group chat.");
  } else {
    toast("Couldn't copy automatically. Long-press the text below to copy.");
  }
}

// ============ MODALS ============
var backdrop = document.getElementById("modal-backdrop");
var modalContent = document.getElementById("modal-content");
backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModal(); });
function closeModal() { backdrop.classList.remove("open"); }
function openModal(html) { modalContent.innerHTML = html; backdrop.classList.add("open"); }

function statsBlockHTML() {
  var winPct = stats.played ? Math.round((stats.won / stats.played) * 100) : 0;
  return '<div class="stats-grid">' +
    '<div class="stat"><div class="num">' + stats.played + '</div><div class="lbl">PLAYED</div></div>' +
    '<div class="stat"><div class="num">' + winPct + '%</div><div class="lbl">WIN RATE</div></div>' +
    '<div class="stat"><div class="num">' + displayStreak() + '</div><div class="lbl">STREAK</div></div>' +
    '<div class="stat"><div class="num">' + stats.maxStreak + '</div><div class="lbl">BEST</div></div>' +
    '</div>';
}

function countdownHTML() {
  return '<div class="countdown">Next HB word in <b id="cd"></b></div>';
}
function startCountdown() {
  var el = document.getElementById("cd");
  if (!el) return;
  function tick() {
    var now = new Date();
    var mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    var s = Math.floor((mid - now) / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    el.textContent = h + "h " + m + "m " + sec + "s";
  }
  tick();
  clearInterval(window._cdInt);
  window._cdInt = setInterval(tick, 1000);
}

function escapeHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function openResultModal() {
  var title = won ? ["Nailed it!", "Solid!", "So local.", "Legend.", "Clutch.", "Phew!"][Math.min(guesses.length - 1, 5)] : "Tomorrow's another day";
  var html =
    '<button class="close-x" onclick="closeModal()">&times;</button>' +
    '<h2>' + title + '</h2>' +
    (PREVIEW ? '<div class="preview-banner">PREVIEW MODE — nothing saved</div>' : '') +
    '<div class="result-word' + (won ? '' : ' lost') + '">' + ANSWER + '</div>' +
    '<div class="blurb"><span class="blurb-label">WHY ' + ANSWER + '?</span>' + BLURB + '</div>' +
    statsBlockHTML() +
    '<button class="share-btn" onclick="doShare()">SHARE YOUR SCORE</button>' +
    '<div class="share-preview">' + escapeHTML(shareText()) + '</div>' +
    countdownHTML();
  openModal(html);
  startCountdown();
}

document.getElementById("stats-btn").onclick = function () {
  openModal(
    '<button class="close-x" onclick="closeModal()">&times;</button>' +
    '<h2>Your stats</h2>' + statsBlockHTML() +
    (gameOver ? '<button class="share-btn" onclick="doShare()">SHARE TODAY\'S SCORE</button>' : '') +
    countdownHTML()
  );
  startCountdown();
};

// ============ PREVIEW MODE ============
// Builds fake guesses so you can walk the full end-of-game flow
// (result modal, blurb, share) without solving the puzzle.
function makePreviewGuesses(winIt) {
  var others = WORDS.map(function (w) { return w[0]; })
    .filter(function (w) { return w.length === LEN && w !== ANSWER; });
  var scramble = ANSWER.slice(1) + ANSWER[0];
  var wrong = [];
  var need = winIt ? 2 : MAX_GUESSES;
  for (var i = 0; i < need; i++) wrong.push(others[i % others.length] || scramble);
  return winIt ? wrong.concat([ANSWER]) : wrong;
}
function runPreview() {
  won = PREVIEW === "win";
  gameOver = true;
  guesses = makePreviewGuesses(won);
  guesses.forEach(function (g, i) { paintRow(i, g, false); });
  toast("Preview mode: " + PREVIEW + ". Nothing is saved.", 2500);
  setTimeout(openResultModal, 700);
}

// ============ INIT ============
function init() {
  document.getElementById("puzzle-meta").textContent = "PUZZLE #" + dayNum + " · " + LEN + " LETTERS";
  buildBoard();
  buildKeyboard();
  updateStreakChip();

  if (PREVIEW) { runPreview(); return; }

  if (dayState && dayState.guesses) {
    guesses = dayState.guesses;
    won = !!dayState.won;
    gameOver = !!dayState.over;
    usedHint = !!dayState.hint;
    guesses.forEach(function (g, i) { paintRow(i, g, false); });
    if (usedHint) {
      document.getElementById("hint-btn").style.display = "none";
      var h = document.getElementById("hint-text");
      h.innerHTML = '<span class="cat">' + CATEGORY + '</span> &middot; ' + CLUE;
      h.style.display = "inline-block";
    }
    if (gameOver) setTimeout(openResultModal, 400);
  }
}
init();
</script>
</body>
